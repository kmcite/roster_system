name: roster_system
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  uuid: ^4.4.0
  path_provider: ^2.1.5
  path: ^1.9.0
  faker: ^2.2.0
  hive_flutter: ^1.1.0
  provider: ^6.1.5
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  forui_assets: ^0.25.0
dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  objectbox_generator: ^5.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
  image_path: assets/branding/app_icon.jpg
  adaptive_icon_background: "#E4E9F2"
  adaptive_icon_foreground: assets/branding/app_icon.jpg

flutter_native_splash:
  background_image: assets/branding/splash_full_light.png
  background_image_dark: assets/branding/splash_full_dark.png
  android_gravity: center
  ios_content_mode: scaleAspectFill
  fullscreen: true
  android_12:
    color: "#D4E4FF"
    image: assets/branding/splash_icon_rounded.png
    color_dark: "#0A0E14"
    image_dark: assets/branding/splash_icon_rounded.png
    icon_background_color: "#F8FAFD"
    icon_background_color_dark: "#1C2230"
  ios: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
